name: Release Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      type:
        description: Type de tag (beta = x.(+1).0, stable = (+1).0.0)
        type: choice
        options: [beta, stable]
        default: beta

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # push master -> x.y.(z+1) | beta -> x.(y+1).0-beta | stable -> (x+1).0.0
      - name: Compute version
        env:
          TYPE: ${{ github.event.inputs.type || 'patch' }}
        run: |
          LAST=$(git tag -l 'v*' | sed -nE 's/^v([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' | sort -V | tail -n1)
          LAST=${LAST:-0.0.0}
          IFS=. read -r MAJ MIN PAT <<< "$LAST"
          case "$TYPE" in
            stable) VERSION="$((MAJ+1)).0.0"; TAG="v$VERSION"; PRE=false ;;
            beta)   VERSION="$MAJ.$((MIN+1)).0"; TAG="v$VERSION-beta"; PRE=true ;;
            *)      VERSION="$MAJ.$MIN.$((PAT+1))"; TAG="v$VERSION"; PRE=true ;;
          esac
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "PRERELEASE=$PRE" >> "$GITHUB_ENV"
          echo "Version: $TAG (précédente: $LAST)"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Apply version
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" App_Resources/Android/app.gradle

      - run: npm ci

      - run: npm install -g nativescript@9
      # Keystore auto-signé : fourni via le secret KEYSTORE_BASE64, sinon généré à la volée.
      # Pour que les mises à jour s'installent par-dessus, définir les secrets (même clé à chaque release).
      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "STORE_PASS=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.jks" -alias release \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass audiobook -keypass audiobook \
              -dname "CN=Audiobook Player, O=Self, C=FR"
            echo "STORE_PASS=audiobook" >> "$GITHUB_ENV"
          fi

      - name: Build signed APK
        run: >
          ns build android --release
          --key-store-path "$RUNNER_TEMP/release.jks"
          --key-store-password "$STORE_PASS"
          --key-store-alias release
          --key-store-alias-password "$STORE_PASS"

      - name: Locate APK
        run: |
          APK=$(find platforms/android -name '*release*.apk' | head -n1)
          mkdir -p dist && cp "$APK" "dist/audiobook-player-$TAG.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.TAG }}
          prerelease: ${{ env.PRERELEASE == 'true' }}
          generate_release_notes: true
          files: dist/audiobook-player-${{ env.TAG }}.apk
