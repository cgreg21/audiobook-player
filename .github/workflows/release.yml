name: Release Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      type:
        description: Type de tag (beta = x.(+1).0, stable = (+1).0.0)
        type: choice
        options: [beta, stable]
        default: beta

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # push master -> x.y.(z+1) | beta -> x.(y+1).0-beta | stable -> (x+1).0.0
      - name: Compute version
        env:
          TYPE: ${{ github.event.inputs.type || 'patch' }}
        run: |
          LAST=$(git tag -l 'v*' | sed -nE 's/^v([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' | sort -V | tail -n1)
          LAST=${LAST:-0.0.0}
          IFS=. read -r MAJ MIN PAT <<< "$LAST"
          case "$TYPE" in
            stable) VERSION="$((MAJ+1)).0.0"; TAG="v$VERSION"; PRE=false ;;
            beta)   VERSION="$MAJ.$((MIN+1)).0"; TAG="v$VERSION-beta"; PRE=true ;;
            *)      VERSION="$MAJ.$MIN.$((PAT+1))"; TAG="v$VERSION"; PRE=true ;;
          esac
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "PRERELEASE=$PRE" >> "$GITHUB_ENV"
          PREV=$(git tag -l 'v*' | sort -V | tail -n1)
          RANGE=${PREV:+$PREV..}HEAD
          {
            echo "## $TAG"
            echo
            git log "$RANGE" --no-merges --pretty='- %s (%h)'
            echo
            [ -n "$PREV" ] && echo "**Changements depuis $PREV** : https://github.com/${{ github.repository }}/compare/$PREV...$TAG"
          } > "$RUNNER_TEMP/changelog.md"
          cat "$RUNNER_TEMP/changelog.md"
          echo "Version: $TAG (précédente: $LAST)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "emulator" "platforms;android-36" "build-tools;36.0.0"

      - name: Validate release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::Configure KEYSTORE_BASE64 with the persistent Android release keystore."; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::Configure KEYSTORE_PASSWORD for the release keystore."; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias release > /dev/null

      - name: Build signed native APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          bash ./android-native/gradlew -p android-native :app:assembleRelease \
            -PappVersionCode="${{ github.run_number }}" \
            -PappVersionName="$VERSION" \
            -PreleaseStoreFile="$RUNNER_TEMP/release.jks" \
            -PreleaseStorePassword="$KEYSTORE_PASSWORD" \
            -PreleaseKeyAlias=release \
            -PreleaseKeyPassword="$KEYSTORE_PASSWORD"

      - name: Locate APK
        run: |
          APK=android-native/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          mkdir -p dist && cp "$APK" "dist/audiobook-player-$TAG.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.TAG }}
          prerelease: ${{ env.PRERELEASE == 'true' }}
          body_path: ${{ runner.temp }}/changelog.md
          files: dist/audiobook-player-${{ env.TAG }}.apk

      # Persist the release version in the native Android project.
      - name: Commit version bump
        if: github.ref_type == 'branch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sed -i -E "s/versionName = \"[^\"]*\"/versionName = \"$VERSION\"/" android-native/app/build.gradle.kts
          git add android-native/app/build.gradle.kts
          git diff --cached --quiet || git commit -m "chore: version $VERSION [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
