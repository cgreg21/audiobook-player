<GridLayout *ngIf="state.infoBook() as book" class="drawer-layer">
  <GridLayout class="drawer-scrim" (tap)="state.infoBook.set(null)"></GridLayout>
  <GridLayout rows="auto, *, auto" class="picker" verticalAlignment="center" height="85%">
    <GridLayout row="0" columns="auto, *" class="picker-header">
      <Image col="0" [src]="book.artwork || (book.kind === 'podcast' ? 'res://cover_podcast' : 'res://cover_folder')" class="info-cover" stretch="aspectFill"></Image>
      <StackLayout col="1" verticalAlignment="center" marginLeft="12">
        <Label [text]="book.title" class="picker-heading" textWrap="true"></Label>
        <Label *ngIf="book.subtitle" [text]="book.subtitle" class="book-meta" textWrap="true"></Label>
        <Label *ngIf="book.author" [text]="'Auteur : ' + book.author" class="book-meta" textWrap="true"></Label>
      </StackLayout>
    </GridLayout>
    <ScrollView row="1">
      <StackLayout>
        <Label *ngIf="!book.asin" text="Aucune information trouvée en ligne pour ce livre." class="book-meta" textWrap="true"></Label>
        <Label *ngIf="book.narrators?.length" [text]="'Narrateur : ' + book.narrators?.join(', ')" class="book-meta" textWrap="true"></Label>
        <Label *ngIf="book.series" [text]="'Saga : ' + book.series + (book.seriesPosition ? ' #' + book.seriesPosition : '')" class="book-meta" textWrap="true"></Label>
        <Label *ngIf="book.genres?.length" [text]="'Catégories : ' + book.genres?.join(', ')" class="book-meta" textWrap="true"></Label>
        <Label *ngIf="book.publisher" [text]="'Éditeur : ' + book.publisher" class="book-meta" textWrap="true"></Label>
        <Label *ngIf="book.releaseDate" [text]="'Sortie : ' + book.releaseDate" class="book-meta"></Label>
        <Label *ngIf="book.runtimeMin" [text]="'Durée : ' + duration(book.runtimeMin)" class="book-meta"></Label>
        <Label *ngIf="book.rating" [text]="'Note : ' + book.rating" class="book-meta"></Label>
        <Label *ngIf="book.language" [text]="'Langue : ' + book.language" class="book-meta"></Label>
        <Label *ngIf="book.chapters?.length" [text]="'Chapitres : ' + book.chapters?.length" class="book-meta"></Label>
        <Label *ngIf="book.summary" [text]="book.summary" class="info-summary" textWrap="true"></Label>
      </StackLayout>
    </ScrollView>
    <GridLayout row="2" class="picker-actions">
      <Button text="Fermer" class="primary-button" (tap)="state.infoBook.set(null)"></Button>
    </GridLayout>
  </GridLayout>
</GridLayout>
