<GridLayout *ngIf="catalog.continueBook() as current" rows="auto, auto" class="continue-card">
  <GridLayout row="0" columns="auto, *, auto" class="continue-main">
    <Image col="0" [src]="current.artwork || (current.kind === 'podcast' ? 'res://cover_podcast' : 'res://cover_folder')" class="book-cover" stretch="aspectFill"></Image>
    <StackLayout col="1" verticalAlignment="center">
      <Label [text]="current.title" class="book-title" textWrap="true"></Label>
      <Label [text]="trackName(current)" class="book-meta"></Label>
    </StackLayout>
    <GridLayout appPress col="2" class="play-round" verticalAlignment="center" (tap)="catalog.play(current)">
      <Label text="▶" class="play-round-icon" horizontalAlignment="center" verticalAlignment="center"></Label>
    </GridLayout>
  </GridLayout>
  <GridLayout row="1" class="progress-track">
    <StackLayout [scaleX]="chapterFraction(current)" originX="0" class="progress-fill"></StackLayout>
  </GridLayout>
</GridLayout>
