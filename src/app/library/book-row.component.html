<GridLayout appPress columns="auto, *, auto" class="book-row" (tap)="opened.emit()">
  <Image col="0" [src]="book().artwork || (book().kind === 'podcast' ? 'res://cover_podcast' : 'res://cover_folder')" class="book-cover" stretch="aspectFill"></Image>
  <StackLayout col="1" verticalAlignment="center">
    <Label [text]="book().title" class="book-title" textWrap="true"></Label>
    <Label [text]="catalog.bookSummary(book())" class="book-meta"></Label>
  </StackLayout>
  <Label
    col="2"
    *ngIf="catalog.bookStatus(book()) as status"
    class="mi status-icon"
    [class.status-progress]="status === 'progress'"
    [class.status-done]="status === 'done'"
    [text]="status === 'progress' ? '\ue18c' : '\ue184'"
    verticalAlignment="center"
  ></Label>
  <StackLayout
    col="0"
    *ngIf="catalog.isNew(book())"
    class="status-new-dot"
    horizontalAlignment="left"
    verticalAlignment="top"
  ></StackLayout>
</GridLayout>
