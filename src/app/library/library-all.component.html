<StackLayout>
  <Label text="‹  Retour" class="back-link" (tap)="state.libraryAll.set(false)"></Label>

  <GridLayout columns="*, auto, auto" class="section-heading">
    <Label col="0" [text]="'Tous (' + filters.results().length + ')'" class="section-title" verticalAlignment="center"></Label>
    <Button col="1" [text]="filters.sortLabel() + '  \u25BE'" class="option-chip filter-chip active" verticalAlignment="center" (tap)="pickSort()"></Button>
    <Button col="2" [text]="'Filtres' + (filters.activeCount() ? ' (' + filters.activeCount() + ')' : '') + '  \u25BE'" class="option-chip filter-chip active" verticalAlignment="center" (tap)="filters.drawerOpen.set(true)"></Button>
  </GridLayout>

  <app-book-row *ngFor="let book of filters.results()" [book]="book" (opened)="state.selectedBook.set(book)"></app-book-row>
  <Label *ngIf="!filters.results().length" text="Aucun élément pour ces filtres." class="empty-description" textWrap="true"></Label>
</StackLayout>
