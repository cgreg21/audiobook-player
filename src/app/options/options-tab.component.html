<StackLayout class="screen-content">
  <StackLayout class="option-card">
    <Label text="Apparence" class="option-title"></Label>
    <Label text="Thème" class="option-label"></Label>
    <GridLayout columns="*, *, *" class="option-chips">
      <Button
        *ngFor="let choice of themeChoices; let i = index"
        [col]="i"
        [text]="choice.label"
        class="option-chip"
        [class.active]="settings.themeMode() === choice.value"
        (tap)="settings.setThemeMode(choice.value)"
      ></Button>
    </GridLayout>
    <Label text="Couleur d’accent" class="option-label"></Label>
    <GridLayout columns="*, *, *, *" class="option-chips">
      <Button
        *ngFor="let choice of accentChoices; let i = index"
        [col]="i"
        [text]="choice.label"
        class="option-chip"
        [class.active]="settings.accent() === choice.value"
        (tap)="settings.setAccent(choice.value)"
      ></Button>
    </GridLayout>
  </StackLayout>

  <StackLayout class="option-card">
    <Label text="Stockage" class="option-title"></Label>
    <Label text="Emplacement des nouveaux téléchargements" class="option-label"></Label>
    <GridLayout columns="*, *" class="option-chips">
      <Button
        col="0"
        text="Interne"
        class="option-chip"
        [class.active]="settings.storage() === 'internal'"
        (tap)="setStorage('internal')"
      ></Button>
      <Button
        col="1"
        text="Externe"
        class="option-chip"
        [class.active]="settings.storage() === 'external'"
        (tap)="setStorage('external')"
      ></Button>
    </GridLayout>
    <Label [text]="downloadsPath()" class="option-path" textWrap="true"></Label>
    <Label
      text="Les épisodes déjà téléchargés restent à leur emplacement actuel."
      class="book-meta"
      textWrap="true"
    ></Label>
  </StackLayout>

  <StackLayout class="option-card">
    <Label text="Utilisation" class="option-title"></Label>
    <GridLayout columns="*, auto" class="option-row">
      <Label col="0" text="Téléchargements" class="option-label"></Label>
      <Label col="1" [text]="formatSize(usageTotal())" class="option-value"></Label>
    </GridLayout>
    <GridLayout columns="*, auto" class="option-row">
      <Label col="0" text="Base de données" class="option-label"></Label>
      <Label col="1" [text]="formatSize(databaseBytes())" class="option-value"></Label>
    </GridLayout>
    <GridLayout columns="*, auto" class="option-row">
      <Label col="0" text="Espace libre sur l’appareil" class="option-label"></Label>
      <Label col="1" [text]="formatSize(freeBytes())" class="option-value"></Label>
    </GridLayout>
    <GridLayout *ngFor="let item of usage()" columns="*, auto" class="option-row">
      <StackLayout col="0">
        <Label [text]="item.title" class="book-title" textWrap="true"></Label>
        <Label [text]="item.episodes + (item.episodes > 1 ? ' épisodes' : ' épisode')" class="book-meta"></Label>
      </StackLayout>
      <Label col="1" [text]="formatSize(item.bytes)" class="option-value" verticalAlignment="center"></Label>
    </GridLayout>
    <Button
      text="Supprimer tous les téléchargements"
      class="danger-button"
      [isEnabled]="usageTotal() > 0"
      (tap)="clearDownloads()"
    ></Button>
  </StackLayout>

  <StackLayout class="option-card">
    <Label text="Dossier de la bibliothèque" class="option-title"></Label>
    <Label *ngIf="!folders().length" text="Aucun dossier importé." class="book-meta"></Label>
    <GridLayout *ngFor="let folder of folders()" columns="*, auto" class="option-row">
      <Label col="0" [text]="folder.label" class="option-label" textWrap="true" verticalAlignment="center"></Label>
      <Button col="1" text="Retirer" class="download-button" (tap)="removeFolder(folder)"></Button>
    </GridLayout>
    <Button [text]="folders().length ? 'Changer de dossier' : '＋  Ajouter un dossier'" class="primary-button" (tap)="importFolder()"></Button>
  </StackLayout>

  <StackLayout class="option-card">
    <Label text="Mise à jour" class="option-title"></Label>
    <Label
      *ngIf="updates.status() === 'available' || updates.status() === 'downloading'"
      [text]="'Version ' + updates.latest()?.tag + ' disponible'"
      class="book-meta"
    ></Label>
    <Label *ngIf="updates.status() === 'uptodate'" text="L’application est à jour." class="book-meta"></Label>
    <Label *ngIf="updates.message()" [text]="updates.message()" class="book-meta" textWrap="true"></Label>
    <Button
      *ngIf="updates.status() !== 'available' && updates.status() !== 'downloading'"
      [text]="updates.status() === 'checking' ? 'Vérification…' : 'Rechercher une mise à jour'"
      class="primary-button"
      [isEnabled]="updates.status() !== 'checking'"
      (tap)="updates.check()"
    ></Button>
    <Button
      *ngIf="updates.status() === 'available' || updates.status() === 'downloading'"
      [text]="updates.status() === 'downloading' ? 'Téléchargement…' : 'Télécharger et installer'"
      class="primary-button"
      [isEnabled]="updates.status() === 'available'"
      (tap)="updates.install()"
    ></Button>
  </StackLayout>

  <Label [text]="'Version ' + version" class="book-meta" horizontalAlignment="center" margin="8 0 16 0"></Label>
</StackLayout>
