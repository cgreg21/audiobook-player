<ng-template #art let-book>
  <GridLayout rows="auto" class="player-art turntable">
    <GridLayout [appSpin]="player.playing()" [spinPeriod]="spinPeriod()" class="vinyl">
      <GridLayout class="groove groove-1"></GridLayout>
      <GridLayout class="groove groove-2"></GridLayout>
      <GridLayout class="groove groove-3"></GridLayout>
      <Image [src]="book?.artwork || (book?.kind === 'podcast' ? 'res://cover_podcast' : 'res://cover_folder')" class="vinyl-label" stretch="aspectFill"></Image>
      <GridLayout class="vinyl-hole"></GridLayout>
    </GridLayout>
    <GridLayout [appRotateTo]="armAngle()" originX="0.5" originY="0" class="tonearm">
      <StackLayout class="tonearm-rod"></StackLayout>
      <StackLayout class="tonearm-head"></StackLayout>
    </GridLayout>
    <GridLayout class="tonearm-pivot"></GridLayout>
  </GridLayout>
</ng-template>

<ng-template #info let-book>
  <Label [text]="book.tracks[player.trackIndex()]?.name" class="player-title" textWrap="true"></Label>
  <Label [text]="book.title" class="player-description" textWrap="true"></Label>
</ng-template>

<ng-template #transport>
  <Slider
    [maxValue]="player.durationMs() || 1"
    [value]="player.positionMs()"
    (valueChange)="onSeek($any($event).value)"
    class="player-slider"
  ></Slider>
  <GridLayout rows="auto" columns="*, *" class="player-times">
    <Label col="0" [text]="formatTime(player.positionMs())" class="player-time"></Label>
    <Label col="1" [text]="formatTime(player.durationMs())" class="player-time end"></Label>
  </GridLayout>

  <GridLayout rows="auto" columns="*, *, auto, *, *" class="player-controls">
    <Label col="0" text="&#xe5a4;" class="mi control control-skip" (tap)="player.skipTo(player.trackIndex() - 1)"></Label>
    <Label col="1" text="&#xe6a8;" class="mi control control-seek" (tap)="player.seekBy(-15000)"></Label>
    <Label col="2" [text]="player.playing() ? '\ue39e' : '\ue3d0'" class="mi control-main" (tap)="player.toggle()"></Label>
    <Label col="3" text="&#xe6a6;" class="mi control control-seek" (tap)="player.seekBy(30000)"></Label>
    <Label col="4" text="&#xe5a6;" class="mi control control-skip" (tap)="player.skipTo(player.trackIndex() + 1)"></Label>
  </GridLayout>
</ng-template>

<ng-template #idleText>
  <Label text="Aucun livre sélectionné" class="player-title"></Label>
  <Label
    text="Choisissez un livre dans votre bibliothèque pour commencer l’écoute."
    class="player-description"
    textWrap="true"
  ></Label>
  <Button text="Découvrir ma bibliothèque" class="primary-button player-button" (tap)="state.setTab('library')"></Button>
</ng-template>

<GridLayout>
<ng-container *ngIf="player.book() as book; else idle">
  <StackLayout *ngIf="!state.landscape(); else wide" class="player-content">
    <ng-container *ngTemplateOutlet="art; context: { $implicit: book }"></ng-container>
    <ng-container *ngTemplateOutlet="info; context: { $implicit: book }"></ng-container>
    <ng-container *ngTemplateOutlet="transport"></ng-container>
  </StackLayout>

  <ng-template #wide>
    <GridLayout columns="auto, *" class="player-content player-wide">
      <ng-container *ngTemplateOutlet="art; context: { $implicit: book }"></ng-container>
      <StackLayout col="1" class="player-side" verticalAlignment="center">
        <ng-container *ngTemplateOutlet="info; context: { $implicit: book }"></ng-container>
        <ng-container *ngTemplateOutlet="transport"></ng-container>
      </StackLayout>
    </GridLayout>
  </ng-template>
</ng-container>

<ng-template #idle>
  <StackLayout *ngIf="!state.landscape(); else idleWide" class="player-content">
    <ng-container *ngTemplateOutlet="art; context: { $implicit: null }"></ng-container>
    <ng-container *ngTemplateOutlet="idleText"></ng-container>
  </StackLayout>

  <ng-template #idleWide>
    <GridLayout columns="auto, *" class="player-content player-wide">
      <ng-container *ngTemplateOutlet="art; context: { $implicit: null }"></ng-container>
      <StackLayout col="1" class="player-side" verticalAlignment="center">
        <ng-container *ngTemplateOutlet="idleText"></ng-container>
      </StackLayout>
    </GridLayout>
  </ng-template>
</ng-template>
<GridLayout *ngIf="player.book() as open" class="drawer-layer">
  <GridLayout class="drawer-scrim" [opacity]="scrimOpacity()" [visibility]="drawerProgress() > 0.02 ? 'visible' : 'collapse'" (tap)="closeDrawer()"></GridLayout>
  <GridLayout #drawer rows="auto, auto" class="drawer" verticalAlignment="bottom" [height]="drawerHeight()" [translateY]="closedY()">
    <GridLayout row="0" rows="auto, auto" class="drawer-header" (pan)="onPan($any($event))" (tap)="toggleDrawer()">
      <StackLayout row="0" class="drawer-handle"></StackLayout>
      <Label row="1" [text]="'Chapitres · ' + open.title" class="drawer-title" textWrap="false"></Label>
    </GridLayout>
    <ScrollView row="1" [height]="drawerHeight() - 64">
      <StackLayout>
        <GridLayout
          *ngFor="let track of open.tracks; let i = index"
          columns="auto, *, auto"
          class="drawer-row"
          [class.current]="i === player.trackIndex()"
          (tap)="playChapter(i)"
        >
          <Label col="0" [text]="i === player.trackIndex() ? (player.playing() ? '\ue44a' : '\ue39e') : player.isChapterRead(open.id, i) ? '\ue184' : ''" class="mi drawer-state" verticalAlignment="center"></Label>
          <Label col="1" [text]="track.name" class="drawer-name" verticalAlignment="center"></Label>
          <Label col="2" [text]="i === player.trackIndex() ? 'En cours' : player.isChapterRead(open.id, i) ? 'Terminé' : ''" class="drawer-status" verticalAlignment="center"></Label>
        </GridLayout>
      </StackLayout>
    </ScrollView>
  </GridLayout>
</GridLayout>
</GridLayout>
