<GridLayout columns="*, auto, auto" class="topbar">
  <StackLayout col="0" class="topbar-copy" verticalAlignment="center">
    <Label [text]="title()" class="screen-title"></Label>
  </StackLayout>
  <Label
    col="1"
    text="●"
    class="net-badge"
    [class.offline]="!state.online()"
    verticalAlignment="center"
  ></Label>
  <Label
    appPress
    col="2"
    text="⚙"
    class="brand-mark"
    [class.active]="state.activeTab() === 'options'"
    (tap)="state.setTab('options')"
    verticalAlignment="center"
  ></Label>
</GridLayout>
