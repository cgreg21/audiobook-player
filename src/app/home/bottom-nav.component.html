<GridLayout columns="*, *, *" class="bottom-nav">
  <StackLayout
    appPress
    *ngFor="let item of items; let i = index"
    [col]="i"
    class="nav-item"
    [class.active]="state.activeTab() === item.tab"
    (tap)="state.setTab(item.tab)"
  >
    <Label [text]="item.icon" class="mi nav-icon"></Label>
  </StackLayout>
</GridLayout>
